name: CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate exact main commit
        run: |
          python3 -B -m unittest discover -s ops/production -p test_preparation.py
          bash ./gradlew clean test build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable candidate
        id: image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          tag="$REGISTRY/lifeasgame-api:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$tag" .
          docker push "$tag"
          digest=$(aws ecr describe-images --repository-name lifeasgame-api --image-ids "imageTag=${tag##*:}" --query 'imageDetails[0].imageDigest' --output text)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$REGISTRY/lifeasgame-api@$digest" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\nImage: `%s/lifeasgame-api@%s`\n' "$GITHUB_SHA" "$REGISTRY" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer exact configuration and call the deployment script
        env:
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ $EC2_HOST =~ ^[a-zA-Z0-9.-]+$ && $EC2_USER =~ ^[a-z_][a-z0-9_-]*$ && -n $KNOWN_HOSTS ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh_args=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          target="$EC2_USER@$EC2_HOST"
          release="/opt/lifeasgame/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git archive "$GITHUB_SHA" ops/production src/main/resources/db/migration > release.tar
          ssh "${ssh_args[@]}" "$target" "umask 077; mkdir '$release' && tar -xf - -C '$release'" < release.tar
          ssh "${ssh_args[@]}" "$target" "printf '%s\\n' '$GITHUB_SHA' > '$release/SOURCE_SHA'; bash '$release/ops/production/rollout.sh' '$GITHUB_SHA' '$APP_IMAGE'"
