spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    online.lifeasgame: INFO
    com.zaxxer.hikari: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO

lifeasgame:
  web:
    cors:
      allowed-origins: ${LIFEASGAME_WEB_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
  economy:
    events:
      enabled: false
      channel: economy.events
    quest:
      events:
        enabled: false
        channel: quest.events
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers

app:
  error:
    include-detail-in-response: false
    mask-detail-always-in-logs: true

    docs:
      base: "/errors"
      ext: ""
      fallback: "NOT-FOUND"

    mask-fields: [password, secret, token]
    mask-props: [password, secret, token]
