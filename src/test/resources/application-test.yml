spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

lifeasgame:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
  internal:
    secret: test-internal-secret
    base-url: http://localhost:8080

app:
  quest:
    definition-bootstrap:
      enabled: false

  error:
    docs:
      base: "/errors"
      ext: ""
    mask-fields: [ ]
    mask-props: [ ]
    expose-db-reason: false
    include-detail-in-response: false
    mask-detail-always-in-logs: true

  outbox:
    enabled: false
    fixed-delay-ms: 500
    batch-size: 50
    max-attempts: 10
    retry-delay-ms: 1000
    lease-duration-ms: 30000
    instance-id: test-outbox-instance
